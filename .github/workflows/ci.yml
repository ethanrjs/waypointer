name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Test and build all targets
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          ./gradlew --no-daemon --max-workers=1 clean buildAllTargets \
            "-PtranslationCommit=${source_commit}" \
            --stacktrace --console=plain

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Launch both Minecraft targets
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: xvfb-run -a ./gradlew --no-daemon --max-workers=1 smokeAllTargets "-PtranslationCommit=$(git rev-parse HEAD)" --stacktrace --console=plain

      - name: Upload final-target test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports-mc26.2
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
            build/reports/launch
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare development JARs
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ -z "${mod_version}" ]]; then
            echo "Could not read mod_version from gradle.properties"
            exit 1
          fi

          mkdir -p artifacts
          for target in 26.1.2 26.2; do
            source="build/libs/waypointer-${mod_version}-mc${target}.jar"
            artifact="waypointer-${mod_version}-build${GITHUB_RUN_NUMBER}-mc${target}.jar"

            if [[ ! -f "${source}" ]]; then
              echo "Missing distributable JAR: ${source}"
              exit 1
            fi

            cp "${source}" "artifacts/${artifact}"
            output_name="jar_${target//./_}"
            echo "${output_name}=${artifact}" >> "${GITHUB_OUTPUT}"
          done

      - name: Upload Minecraft 26.1.2 JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifacts/${{ steps.artifacts.outputs.jar_26_1_2 }}
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload Minecraft 26.2 JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifacts/${{ steps.artifacts.outputs.jar_26_2 }}
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 14
