name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Test and build all targets
        run: ./gradlew --no-daemon --max-workers=1 clean buildAllTargets --stacktrace --console=plain

      - name: Upload development JARs
        uses: actions/upload-artifact@v7
        with:
          name: waypointer-${{ github.sha }}
          path: |
            build/libs/waypointer-*-mc*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-shadow.jar
          if-no-files-found: error
          retention-days: 14
