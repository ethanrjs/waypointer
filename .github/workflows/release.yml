name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to validate without publishing
        required: true
        default: v1.8.6

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MINECRAFT_1_21_11_COMMIT: 94632f86bbc327c043c4f56dfd6341a9cf4fc2a2
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Require tag to match mod version
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "${RELEASE_TAG}" != "v${mod_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match mod version ${mod_version}"
            exit 1
          fi

      - name: Require handwritten release notes
        shell: bash
        run: |
          set -euo pipefail
          notes="release-notes/${RELEASE_TAG}.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing release notes: $notes"
            exit 1
          fi

      - name: Test and build Minecraft 26.x targets
        run: ./gradlew --no-daemon --max-workers=1 clean buildAllTargets --stacktrace --console=plain

      - name: Collect Minecraft 26.x release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          mapfile -d '' jars < <(
            find build/libs -maxdepth 1 -type f -name 'waypointer-*-mc*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-shadow.jar' \
              -print0 | sort -z
          )

          if [[ "${#jars[@]}" -ne 2 ]]; then
            echo "Expected 2 distributable JARs, found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          cp "${jars[@]}" release/

      - name: Check out Minecraft 1.21.11 release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.MINECRAFT_1_21_11_COMMIT }}
          path: minecraft-1.21.11
          persist-credentials: false

      - name: Require Minecraft 1.21.11 release data to match
        shell: bash
        run: |
          set -euo pipefail
          main_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          legacy_version="$(sed -n 's/^mod_version=//p' minecraft-1.21.11/gradle.properties)"

          if [[ "${legacy_version}" != "${main_version}" ]]; then
            echo "Minecraft 1.21.11 version ${legacy_version} does not match ${main_version}"
            exit 1
          fi

          diff -u \
            "release-notes/${RELEASE_TAG}.md" \
            "minecraft-1.21.11/release-notes/${RELEASE_TAG}.md"

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: minecraft-1.21.11/gradle/wrapper/gradle-wrapper.properties

      - name: Test and build Minecraft 1.21.11
        working-directory: minecraft-1.21.11
        run: ./gradlew --no-daemon --max-workers=1 clean build --stacktrace --console=plain

      - name: Collect and verify all release files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' legacy_jars < <(
            find minecraft-1.21.11/build/libs -maxdepth 1 -type f -name 'waypointer-*-mc*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-shadow.jar' \
              -print0 | sort -z
          )

          if [[ "${#legacy_jars[@]}" -ne 1 ]]; then
            echo "Expected 1 Minecraft 1.21.11 JAR, found ${#legacy_jars[@]}"
            printf '%s\n' "${legacy_jars[@]}"
            exit 1
          fi

          cp "${legacy_jars[@]}" release/
          cp "release-notes/${RELEASE_TAG}.md" release/RELEASE_NOTES.md

          mod_version="${RELEASE_TAG#v}"
          check_metadata() {
            local jar="$1"
            local minecraft="$2"
            local java="$3"
            local hypixel_mod_api="$4"
            test -f "${jar}"
            unzip -p "${jar}" fabric.mod.json | jq -e \
              --arg version "${mod_version}" \
              --arg minecraft "${minecraft}" \
              --arg java "${java}" \
              --arg hypixel_mod_api "${hypixel_mod_api}" \
              '.id == "waypointer"
                and .version == $version
                and .depends.minecraft == $minecraft
                and .depends.java == $java
                and .depends["hypixel-mod-api"] == $hypixel_mod_api
                and (((.suggests // {}) | has("hypixel-mod-api")) | not)' \
              >/dev/null
          }

          check_metadata "release/waypointer-${mod_version}-mc26.1.2.jar" ">=26.1.2 <26.2" ">=25" ">=1.0.2"
          check_metadata "release/waypointer-${mod_version}-mc26.2.jar" ">=26.2 <26.3" ">=25" ">=1.0.2"
          check_metadata "release/waypointer-${mod_version}-mc1.21.11.jar" "~1.21.11" ">=21" "1.0.1"

          mapfile -t jars < <(find release -maxdepth 1 -type f -name '*.jar' -print | sort)
          if [[ "${#jars[@]}" -ne 3 ]]; then
            echo "Expected 3 distributable JARs, found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          (
            cd release
            sha256sum ./*.jar > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Attest release JARs
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release/*.jar

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waypointer-release-${{ env.RELEASE_TAG }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: waypointer-release-${{ env.RELEASE_TAG }}
          path: release

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(find release -maxdepth 1 -type f -name '*.jar' -print | sort)
          if [[ "${#jars[@]}" -ne 3 ]]; then
            echo "Expected 3 verified distributable JARs, found ${#jars[@]}"
            exit 1
          fi

          args=(
            "${RELEASE_TAG}"
            --verify-tag
            --title "Waypointer ${RELEASE_TAG#v}"
            --notes-file release/RELEASE_NOTES.md
          )

          if [[ "${RELEASE_TAG}" == *-alpha* ||
                "${RELEASE_TAG}" == *-beta* ||
                "${RELEASE_TAG}" == *-rc* ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}" "${jars[@]}" release/SHA256SUMS.txt
