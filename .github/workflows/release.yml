name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Require tag to match mod version
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "${GITHUB_REF_NAME}" != "v${mod_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod version ${mod_version}"
            exit 1
          fi

      - name: Require handwritten release notes
        shell: bash
        run: |
          set -euo pipefail
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing release notes: $notes"
            exit 1
          fi

      - name: Test and build all targets
        run: ./gradlew --no-daemon --max-workers=1 clean buildAllTargets --stacktrace --console=plain

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          mapfile -d '' jars < <(
            find build/libs -maxdepth 1 -type f -name 'waypointer-*-mc*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-shadow.jar' \
              -print0 | sort -z
          )

          if [[ "${#jars[@]}" -ne 2 ]]; then
            echo "Expected 2 distributable JARs, found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          cp "${jars[@]}" release/
          cp "release-notes/${GITHUB_REF_NAME}.md" release/RELEASE_NOTES.md

          (
            cd release
            sha256sum ./*.jar > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Attest release JARs
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release/*.jar

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waypointer-release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: waypointer-release-${{ github.ref_name }}
          path: release

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(find release -maxdepth 1 -type f -name '*.jar' -print | sort)
          if [[ "${#jars[@]}" -ne 2 ]]; then
            echo "Expected 2 verified distributable JARs, found ${#jars[@]}"
            exit 1
          fi

          args=(
            "${GITHUB_REF_NAME}"
            --verify-tag
            --title "Waypointer ${GITHUB_REF_NAME#v}"
            --notes-file release/RELEASE_NOTES.md
          )

          if [[ "${GITHUB_REF_NAME}" == *-alpha* ||
                "${GITHUB_REF_NAME}" == *-beta* ||
                "${GITHUB_REF_NAME}" == *-rc* ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}" "${jars[@]}" release/SHA256SUMS.txt
