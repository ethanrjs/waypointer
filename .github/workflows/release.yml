name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to validate without publishing
        required: true
        default: v1.10.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Require tag to match mod version
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "${source_commit}" != "${tag_commit}" ]]; then
            echo "Checked-out commit does not match ${RELEASE_TAG}"
            exit 1
          fi
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "${RELEASE_TAG}" != "v${mod_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match mod version ${mod_version}"
            exit 1
          fi

      - name: Require handwritten release notes
        shell: bash
        run: |
          set -euo pipefail
          notes="release-notes/${RELEASE_TAG}.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing release notes: $notes"
            exit 1
          fi

      - name: Test and build Minecraft 26.x targets
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          ./gradlew --no-daemon --max-workers=1 clean buildAllTargets \
            "-PtranslationCommit=${source_commit}" --stacktrace --console=plain

      - name: Collect and verify all release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          mapfile -d '' jars < <(
            find build/libs -maxdepth 1 -type f -name 'waypointer-*-mc*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-shadow.jar' \
              -print0 | sort -z
          )

          if [[ "${#jars[@]}" -ne 2 ]]; then
            echo "Expected 2 distributable JARs, found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          cp "${jars[@]}" release/
          cp "release-notes/${RELEASE_TAG}.md" release/RELEASE_NOTES.md

          mod_version="${RELEASE_TAG#v}"
          check_metadata() {
            local jar="$1"
            local minecraft="$2"
            local java="$3"
            local hypixel_mod_api="$4"
            test -f "${jar}"
            unzip -p "${jar}" fabric.mod.json | jq -e \
              --arg version "${mod_version}" \
              --arg minecraft "${minecraft}" \
              --arg java "${java}" \
              --arg hypixel_mod_api "${hypixel_mod_api}" \
              '.id == "waypointer"
                and .version == $version
                and .depends.minecraft == $minecraft
                and .depends.java == $java
                and .depends["hypixel-mod-api"] == $hypixel_mod_api
                and (((.suggests // {}) | has("hypixel-mod-api")) | not)' \
              >/dev/null
          }

          check_metadata "release/waypointer-${mod_version}-mc26.1.2.jar" ">=26.1 <26.2" ">=25" ">=1.0.2"
          check_metadata "release/waypointer-${mod_version}-mc26.2.jar" ">=26.2 <26.3" ">=25" ">=1.0.2"

          verify_languages() {
            local jar="$1"
            local manifest="$(mktemp)"
            local bundled_count
            bundled_count="$(unzip -Z1 "${jar}" | grep -Ec '^assets/waypointer/lang/[^/]+\.json$')"
            if [[ "${bundled_count}" -ne 1 ]] || ! unzip -Z1 "${jar}" | grep -qx 'assets/waypointer/lang/en_us.json'; then
              echo "${jar} must bundle only en_us.json"
              exit 1
            fi
            unzip -p "${jar}" assets/waypointer/i18n/remote-locales.json > "${manifest}"
            jq -e --arg commit "$(git rev-parse HEAD)" \
              '.schema == 1 and .enabled == true
                and .repository == "ethanrjs/waypointer"
                and .commit == $commit
                and .pathTemplate == "translations/lang/{locale}.json"' \
              "${manifest}" >/dev/null
            while IFS=$'\t' read -r locale digest bytes; do
              local file="translations/lang/${locale}.json"
              test -f "${file}"
              test "$(sha256sum "${file}" | cut -d' ' -f1)" = "${digest}"
              test "$(wc -c < "${file}" | tr -d ' ')" = "${bytes}"
            done < <(jq -r '.locales | to_entries[] | [.key, .value.sha256, .value.bytes] | @tsv' "${manifest}")
            test "$(jq '.locales | length' "${manifest}")" = "$(find translations/lang -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
            rm -f "${manifest}"
          }

          verify_languages "release/waypointer-${mod_version}-mc26.1.2.jar"
          verify_languages "release/waypointer-${mod_version}-mc26.2.jar"
          cmp \
            <(unzip -p "release/waypointer-${mod_version}-mc26.1.2.jar" assets/waypointer/i18n/remote-locales.json) \
            <(unzip -p "release/waypointer-${mod_version}-mc26.2.jar" assets/waypointer/i18n/remote-locales.json)

          mapfile -t jars < <(find release -maxdepth 1 -type f -name '*.jar' -print | sort)
          if [[ "${#jars[@]}" -ne 2 ]]; then
            echo "Expected 2 distributable JARs, found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          (
            cd release
            sha256sum ./*.jar > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Attest release JARs
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release/*.jar

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waypointer-release-${{ env.RELEASE_TAG }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: waypointer-release-${{ env.RELEASE_TAG }}
          path: release

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(find release -maxdepth 1 -type f -name '*.jar' -print | sort)
          if [[ "${#jars[@]}" -ne 2 ]]; then
            echo "Expected 2 verified distributable JARs, found ${#jars[@]}"
            exit 1
          fi

          args=(
            "${RELEASE_TAG}"
            --verify-tag
            --title "Waypointer ${RELEASE_TAG#v}"
            --notes-file release/RELEASE_NOTES.md
          )

          if [[ "${RELEASE_TAG}" == *-alpha* ||
                "${RELEASE_TAG}" == *-beta* ||
                "${RELEASE_TAG}" == *-rc* ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}" "${jars[@]}" release/SHA256SUMS.txt
