import groovy.json.JsonOutput

import java.nio.file.Files
import java.security.MessageDigest

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'jacoco'
}

def minecraftTargets = [
		'26.2': [fabricApi: '0.154.2+26.2', dependency: '>=26.2 <26.3']
]
def targetMinecraft = project.minecraft_version.toString()
def target = minecraftTargets[targetMinecraft]
if (target == null) {
	throw new GradleException("Unsupported minecraft_version ${targetMinecraft}; use ${minecraftTargets.keySet().join(' or ')}")
}

def shaderPack = providers.gradleProperty('shaderPack').map { file(it) }
def shaderTestMods = [
		'26.2': [iris: 'oaD6KQls', sodium: '2Yom1N68']
]
if (shaderPack.isPresent() && (!shaderPack.get().isFile()
		|| !shaderPack.get().name.toLowerCase(Locale.ROOT).endsWith('.zip'))) {
	throw new GradleException('-PshaderPack must name an existing shader-pack ZIP')
}

def wrapperCommand = System.getProperty('os.name').startsWith('Windows')
		? ['cmd', '/d', '/c', file('gradlew.bat').absolutePath]
		: [file('gradlew').absolutePath]
def requestedTranslationCommit = providers.gradleProperty('translationCommit')
def allowStaleDocumentation = providers.gradleProperty('allowStaleDocumentation')
		.map { it.toBoolean() }
		.orElse(false)
def forwardedBuildArguments = requestedTranslationCommit.isPresent()
		? ["-PtranslationCommit=${requestedTranslationCommit.get()}"]
		: []
forwardedBuildArguments += "--max-workers=${gradle.startParameter.maxWorkerCount}"
if (allowStaleDocumentation.get()) {
	forwardedBuildArguments += '-PallowStaleDocumentation=true'
}
def buildMinecraft26_2 = tasks.register('buildMinecraft26_2', Exec) {
	commandLine(wrapperCommand
			+ ['clean', 'build', '-Pminecraft_version=26.2', '--console=plain']
			+ forwardedBuildArguments)
}
tasks.register('buildAllTargets') {
	group = 'build'
	description = 'Builds and tests every supported Minecraft target serially.'
	dependsOn buildMinecraft26_2
}

def previousSmokeTask = null
minecraftTargets.keySet().each { minecraftTarget ->
	def prerequisite = previousSmokeTask
	previousSmokeTask = tasks.register("smokeMinecraft${minecraftTarget.replace('.', '_')}", Exec) {
		if (prerequisite != null) dependsOn prerequisite
		commandLine(wrapperCommand + ['runClientGameTest', "-Pminecraft_version=${minecraftTarget}",
				'--no-daemon', '--console=plain'] + forwardedBuildArguments
				+ (shaderPack.isPresent() ? ["-PshaderPack=${shaderPack.get().absolutePath}"] : []))
	}
}
tasks.register('smokeAllTargets') {
	group = 'verification'
	description = 'Launches Minecraft and loads a world on every supported target.'
	dependsOn previousSmokeTask
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${targetMinecraft}"
}

def releaseArchiveBase = "${project.archives_base_name}-${project.mod_version}-mc${targetMinecraft}"
tasks.named('jar', Jar) {
	archiveFileName = "${releaseArchiveBase}.jar"
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
	maven {
		name = 'Hypixel'
		url = 'https://repo.hypixel.net/repository/Hypixel/'
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	accessWidenerPath = file("src/main/resources/waypointer.accesswidener")

	mods {
		"waypointer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'waypointer-smoke'
		enableGameTests = false
		enableClientGameTests = true
		clearRunDirectory = true
		username = 'WaypointerTest'
	}
}

def retainLaunchLogs = tasks.register('retainLaunchLogs', Sync) {
	from(layout.buildDirectory.dir('run/clientGameTest')) {
		include 'logs/**', 'crash-reports/**', 'screenshots/**', 'shader-test.json'
	}
	into layout.buildDirectory.dir("reports/${shaderPack.isPresent() ? 'shaders' : 'launch'}/${targetMinecraft}")
}
tasks.named('runClientGameTest') {
	timeout = java.time.Duration.ofMinutes(shaderPack.isPresent() ? 10 : 5)

	args '--width', '1708', '--height', '960'
	finalizedBy retainLaunchLogs
	if (shaderPack.isPresent()) {
		systemProperty 'waypointer.test.shaders', 'true'
		doFirst {
			def runDir = layout.buildDirectory.dir('run/clientGameTest').get().asFile
			def packs = new File(runDir, 'shaderpacks')
			packs.mkdirs()

			def staged = new File(packs, 'waypointer-test.zip')
			Files.copy(shaderPack.get().toPath(), staged.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			def irisConfig = new File(runDir, 'config/iris.properties')
			irisConfig.parentFile.mkdirs()
			irisConfig.setText('enableShaders=true\nshaderPack=waypointer-test.zip\n', 'UTF-8')
			new File(runDir, 'shader-test.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson([
					minecraft: targetMinecraft, iris: shaderTestMods[targetMinecraft].iris,
					sodium: shaderTestMods[targetMinecraft].sodium, shaderPack: shaderPack.get().name,
					sha256: MessageDigest.getInstance('SHA-256').digest(staged.bytes).encodeHex().toString()
			])) + '\n', 'UTF-8')
		}
		doLast {
			def log = layout.buildDirectory.file('run/clientGameTest/logs/latest.log').get().asFile
			if (!log.isFile()) throw new GradleException('Shader smoke test did not produce a client log')
			def failures = log.readLines('UTF-8').findAll {
				it =~ /(?i)(Could not (allocate|prepare|render|submit).*(preview|inspector)|Waypointer GPU overlay failed|Iris rejected pipeline|Failed to (compile|link).*shader|Shader compilation failed|Failed to create shader rendering pipeline)/
			}
			if (!failures.isEmpty()) throw new GradleException('Shader rendering errors:\n' + failures.join('\n'))
		}
	}
}

def remoteLocaleDirectory = layout.projectDirectory.dir('translations/lang')
def generatedRemoteLocaleResources = layout.buildDirectory.dir('generated/remote-locale-resources')
def remoteLocaleManifest = generatedRemoteLocaleResources.map {
	it.file('assets/waypointer/i18n/remote-locales.json')
}

def generateRemoteLocaleManifest = tasks.register('generateRemoteLocaleManifest') {
	def localeFiles = fileTree(remoteLocaleDirectory) {
		include '*.json'
	}
	inputs.files(localeFiles).withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.property('translationCommit', requestedTranslationCommit.orElse(''))
	outputs.file(remoteLocaleManifest)

	doLast {
		def commit = requestedTranslationCommit.orElse('').get().trim()
		def enabled = !commit.isEmpty()
		if (enabled && !(commit ==~ /[0-9a-f]{40}/)) {
			throw new GradleException('translationCommit must be a lowercase 40-character Git commit SHA')
		}

		def catalogs = new TreeMap<String, Object>()
		localeFiles.files.sort { left, right -> left.name <=> right.name }.each { localeFile ->
			def locale = localeFile.name.substring(0, localeFile.name.length() - '.json'.length())
			if (!(locale ==~ /[a-z0-9]+(?:_[a-z0-9]+)*/)) {
				throw new GradleException("Unsafe locale filename: ${localeFile.name}")
			}
			if (!localeFile.isFile() || Files.isSymbolicLink(localeFile.toPath())) {
				throw new GradleException("Locale must be a regular non-symlink file: ${localeFile}")
			}

			byte[] bytes = localeFile.bytes
			if (enabled) {
				byte[] committedBytes
				try {
					committedBytes = providers.exec {
						commandLine 'git', 'show', "${commit}:translations/lang/${localeFile.name}"
					}.standardOutput.asBytes.get()
				} catch (Exception failure) {
					throw new GradleException(
							"Could not read translations/lang/${localeFile.name} from ${commit}", failure)
				}
				if (!Arrays.equals(bytes, committedBytes)) {
					throw new GradleException(
							"Working-tree locale differs from ${commit}: translations/lang/${localeFile.name}")
				}
			}

			def digest = MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
			catalogs.put(locale, [sha256: digest, bytes: bytes.length])
		}
		if (catalogs.isEmpty()) {
			throw new GradleException("No remote locale catalogs found in ${remoteLocaleDirectory.asFile}")
		}

		def manifest = [
				schema      : 1,
				enabled     : enabled,
				repository  : 'ethanrjs/waypointer',
				commit      : enabled ? commit : '',
				pathTemplate: 'translations/lang/{locale}.json',
				locales     : catalogs
		]
		def output = remoteLocaleManifest.get().asFile
		output.parentFile.mkdirs()
		output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + System.lineSeparator(), 'UTF-8')
	}
}

sourceSets.main.resources.srcDir(generatedRemoteLocaleResources)
tasks.withType(Jar).configureEach {
	if (name == 'sourcesJar') dependsOn generateRemoteLocaleManifest
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
	implementation "net.hypixel:mod-api:${project.hypixel_mod_api_version}"
	gametestRuntimeOnly 'maven.modrinth:1A2mKfBx:SlqCF6Or'
	if (shaderPack.isPresent()) {
		gametestRuntimeOnly "maven.modrinth:iris:${shaderTestMods[targetMinecraft].iris}"
		gametestRuntimeOnly "maven.modrinth:sodium:${shaderTestMods[targetMinecraft].sodium}"
	}

	include implementation('org.brotli:dec:0.1.2')

	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def optInTestProperties = ['coleweight.file', 'v10.corpus', 'v10.regen']
tasks.withType(Test).configureEach {

	optInTestProperties.each { prop ->
		def value = providers.gradleProperty(prop)
		if (System.getProperty(prop) != null) systemProperty prop, System.getProperty(prop)
		else if (value.isPresent()) systemProperty prop, value.get()
	}
}

test {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('validateV10Corpus', Test) {
	group = 'verification'
	description = 'Validates V10 semantic round trips against an external corpus.'
	dependsOn tasks.named('testClasses')
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.babbur.waypointer.codec.V10ExternalCorpusRoundTripTest'
	}
	testLogging.showStandardStreams = true
	doFirst {
		def corpus = System.getProperty('v10.corpus')
		if (corpus == null) corpus = providers.gradleProperty('v10.corpus').orElse('').get()
		if (corpus.trim().isEmpty()) {
			throw new GradleException(
					'validateV10Corpus requires -Pv10.corpus=<path-to-normalized.jsonl>')
		}
	}
}

processResources {
	dependsOn generateRemoteLocaleManifest
	inputs.property "version", project.version
	inputs.property "minecraft_dependency", target.dependency

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version,
				"minecraft_dependency": inputs.properties.minecraft_dependency
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked', '-Werror']
}

tasks.register('verifyDocumentationVersion') {
	inputs.file('API.md')
	inputs.property('modVersion', project.mod_version)
	onlyIf { !allowStaleDocumentation.get() }

	doLast {
		def expectedVersion = project.mod_version.toString()
		def api = file('API.md').getText('UTF-8')
		def expectedApiSnippets = [
				"# Waypointer API ${expectedVersion}",
				"maven.modrinth:waypointer:${expectedVersion}",
				"libs/waypointer-${expectedVersion}-mc26.2.jar"
		]

		expectedApiSnippets.each { snippet ->
			if (!api.contains(snippet)) {
				throw new GradleException("API.md is missing current-version text: ${snippet}")
			}
		}
	}
}

jacocoTestReport {
	dependsOn tasks.named('test')
	sourceSets sourceSets.main, sourceSets.client
	reports {
		xml.required = true
		html.required = true
	}
}

def gpuOnlyClasses = [
		'com/babbur/waypointer/render/gpu/OverlayRenderer*',
		'com/babbur/waypointer/render/gpu/OverlayPass*',
		'com/babbur/waypointer/render/gpu/GpuMesh*',
		'com/babbur/waypointer/render/gpu/DepthSnapshot*',
		'com/babbur/waypointer/render/gpu/IrisBridge*',
		'com/babbur/waypointer/render/gpu/RenderPassTextureBinder*',
		'com/babbur/waypointer/render/gpu/*Compat*'
]

jacocoTestCoverageVerification {
	dependsOn tasks.named('test')
	sourceSets sourceSets.main, sourceSets.client
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: gpuOnlyClasses)
		}))
	}
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.52
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.445
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyDocumentationVersion')
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('sourcesJar', Jar) {
	archiveFileName = "${releaseArchiveBase}-sources.jar"
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
	from("THIRD_PARTY_NOTICES.md")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
